<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mania de Geek - Catálogo</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { max-width: 100%; height: 180px; object-fit: cover; border-radius: 4px; background: #eee; }
        .card h3 { font-size: 14px; margin: 10px 0; color: #333; word-break: break-word; }
        .btn-whats { display: block; background: #25d366; color: white; padding: 8px 15px; border-radius: 4px; text-decoration: none; font-weight: bold; margin-top: auto; }
    </style>
</head>
<body>

    <h1>Mania de Geek - Catálogo</h1>
    <p>Clique no botão para solicitar o orçamento do modelo via WhatsApp</p>

    <div class="grid" id="vitrine">Carregando vitrine...</div>

    <script>
        // CONFIGURAÇÃO: Insira seu WhatsApp aqui (Apenas números com DDD)
        const meuWhats = "5511999999999"; 

        // Rota direta corrigida para servidores como a Vercel localizar as pastas
        fetch('./public/produtos/lista.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Arquivo lista.json não foi encontrado pelo servidor.');
                }
                return response.json();
            })
            .then(fotos => {
                const vitrine = document.getElementById('vitrine');
                vitrine.innerHTML = ''; 

                // Lê apenas formatos válidos de imagem, ignorando o arquivo de texto da lista
                const imagens = fotos.filter(arquivo => arquivo.match(/\.(jpg|jpeg|png|webp|gif)$/i));

                if (imagens.length === 0) {
                    vitrine.innerHTML = "Nenhuma imagem foi encontrada na pasta de produtos.";
                    return;
                }

                imagens.forEach(arquivo => {
                    // Remove extensões e caracteres para deixar o título limpo
                    const nomeProduto = arquivo.replace(/\.[^/.]+$/, "").replace(/[+_-]/g, " ");
                    
                    const textoWhats = encodeURIComponent(`Olá! Gostaria de um orçamento do modelo STLs: ${nomeProduto}`);
                    const linkWhats = `https://wa.me{meuWhats}?text=${textoWhats}`;

                    vitrine.innerHTML += `
                        <div class="card">
                            <img src="./public/produtos/${arquivo}" loading="lazy" alt="${nomeProduto}">
                            <h3>${nomeProduto}</h3>
                            <a href="${linkWhats}" target="_blank" class="btn-whats">Orçamento no Whats</a>
                        </div>
                    `;
                });
            })
            .catch(err => {
                document.getElementById('vitrine').innerHTML = "Erro ao renderizar catálogo. Verifique o caminho dos arquivos.";
                console.error(err);
            });
    </script>
</body>
</html>
